services:
  - type: web
    name: ogabassey-order-desk-mcp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ogabassey-order-desk-db
          property: connectionString
      - key: BUMPA_BASE_URL
        value: https://api.bumpa.xyz/api/commerce/v1
      - key: BUMPA_PUBLIC_KEY
        sync: false
      - key: BUMPA_SECRET_KEY
        sync: false
      - key: BUMPA_LOCATION_ID
        sync: false
      - key: BUMPA_PICKUP_LOCATION_ID
        sync: false
      - key: BUMPA_SHIPPING_METHOD_ID
        sync: false
      - key: MCP_AUTH_TOKEN
        generateValue: true

databases:
  - name: ogabassey-order-desk-db
    plan: free  # Render free Postgres expires after 30 days; upgrade before real use
